# SwiftLint checks the code for bugs, risky patterns and complexity.
# Layout (indentation, line length, braces, commas, blank lines) belongs to swift-format (.swift-format),
# so the rules that would check layout are turned off here and the two tools never disagree.

included:
  - Sources
  - Tests
  - Package.swift

excluded:
  - .build
  - build
  - website

disabled_rules:
  # Owned by swift-format.
  - closing_brace
  - closure_parameter_position
  - colon
  - comma
  - comment_spacing
  - leading_whitespace
  - line_length
  - opening_brace
  - return_arrow_whitespace
  - statement_position
  - switch_case_alignment
  - trailing_comma
  - trailing_newline
  - trailing_whitespace
  - vertical_parameter_alignment
  - vertical_whitespace

opt_in_rules:
  # Crashes and unsafe optionals.
  - force_unwrapping
  - implicitly_unwrapped_optional
  - fatal_error_message
  # Clearer, simpler code.
  - explicit_init
  - first_where
  - last_where
  - contains_over_filter_count
  - contains_over_filter_is_empty
  - contains_over_first_not_nil
  - contains_over_range_nil_comparison
  - empty_count
  - empty_string
  - sorted_first_last
  - redundant_nil_coalescing
  - toggle_bool
  - identical_operands
  - yoda_condition
  - discouraged_optional_boolean
  - weak_delegate
  # Swift conventions (see Code style in CONTRIBUTING.md).
  - private_over_fileprivate
  - prefer_self_in_static_references
  - prefer_self_type_over_type_of_self
  - redundant_type_annotation
  - unneeded_parentheses_in_closure_argument
  - convenience_type
  - unavailable_function
  # Complexity.
  - closure_body_length

force_cast: error
force_try: error

identifier_name:
  # Short coordinate names, as in AppKit's own APIs.
  excluded:
    - x
    - y

cyclomatic_complexity:
  warning: 8
  error: 12
  # A flat switch over an enum's cases is easy to read, however many cases it has.
  ignores_case_statements: true

function_body_length:
  warning: 30
  error: 50

closure_body_length:
  warning: 25
  error: 40

type_body_length:
  warning: 150
  error: 250

file_length:
  warning: 250
  error: 400
  ignore_comment_only_lines: true

function_parameter_count:
  warning: 4
  error: 6

nesting:
  type_level:
    warning: 1
    error: 2
  function_level:
    warning: 2
    error: 3
  # Codable types nest their CodingKeys by convention.
  ignore_coding_keys: true
