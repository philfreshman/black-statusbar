# Periphery finds unused code: declarations, parameters, assign-only properties, imports and redundant `public`.
# It scans every target of the Swift package, tests included, so code used only by tests counts as used.
#
# Periphery reads the index that `swift build` writes while it compiles, so build the tests first:
#   swift build --build-tests && periphery scan

# SwiftPM's default build system (swift-build) writes the index to .build/out,
# not to .build/debug/index/store where Periphery would look on its own.
index_store_path:
  - .build/out
skip_build: true

# Synthesized `==` reads every stored property of an Equatable type, which the index does not show.
retain_equatable_properties: true

strict: true
relative_results: true
disable_update_check: true
