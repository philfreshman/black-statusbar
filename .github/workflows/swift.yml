name: Swift

# Builds, tests and checks the app on every pull request, whatever its base
# branch (so stacked pull requests and release pull requests into main are
# checked too), and on every push to development. A pull request can't bring
# back warnings, formatting or lint problems, dead code or copied code.
# See CONTRIBUTING.md.
on:
  pull_request:
    # The landing page has its own checks (website.yml) and no Swift code.
    paths-ignore:
      - "website/**"
  push:
    branches: [development]
    paths-ignore:
      - "website/**"

permissions:
  contents: read

# Pull request runs are grouped by pull request number, not github.ref: a run
# for an already merged pull request gets the base branch as its ref, so it
# would share a group with the push run on development and cancel it. A new
# commit on a pull request cancels its older run; every push to development
# runs to the end.
concurrency:
  group: swift-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# .build is not cached: a clean build takes about a minute, and a restored
# index store could hold stale entries for deleted files that mislead Periphery.
jobs:
  build:
    name: Build, test and find dead code
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/select-xcode

      - name: Build with warnings as errors
        run: swift build -Xswiftc -warnings-as-errors

      - name: Build the tests with warnings as errors
        run: swift build --build-tests -Xswiftc -warnings-as-errors

      - name: Test
        run: swift test

      # Periphery's repository is archived and Homebrew disables its formula on
      # 2027-08-12, so this installs the final release (3.8.0) from GitHub and
      # checks the download against its published SHA-256.
      - name: Install Periphery
        env:
          PERIPHERY_VERSION: 3.8.0
          PERIPHERY_SHA256: 07d4e286e31dd79164df39097e0b59f533c94badbe18158464a455ea88a166d7
        run: |
          dir="$RUNNER_TEMP/periphery"
          mkdir -p "$dir"
          curl -fsSL -o "$dir/periphery.zip" \
            "https://github.com/peripheryapp/periphery/releases/download/$PERIPHERY_VERSION/periphery-$PERIPHERY_VERSION.zip"
          echo "$PERIPHERY_SHA256  $dir/periphery.zip" | shasum -a 256 -c -
          unzip -q "$dir/periphery.zip" -d "$dir"
          binary="$(find "$dir" -type f -name periphery -perm -u+x | head -n 1)"
          dirname "$binary" >> "$GITHUB_PATH"
          "$binary" version

      # Periphery reads the index store the builds above wrote. SwiftPM's newer
      # default build system (swift-build) writes it to .build/out, as
      # .periphery.yml says; the older native build system writes it to
      # .build/debug/index/store. Pass whichever exists, so this works on an
      # older Xcode on the runner as well as on a newer one.
      - name: Find dead code
        run: |
          for store in .build/out .build/debug/index/store; do
            if [ -d "$store/v5" ]; then
              echo "Index store: $store"
              periphery scan --index-store-path "$store"
              exit
            fi
          done
          echo "::error::No index store found in .build/out or .build/debug/index/store."
          exit 1

  lint:
    name: Format and lint
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/select-xcode

      - name: Check formatting (swift format)
        run: swift format lint --strict --recursive Sources Tests Package.swift

      # Homebrew has no versioned formula for SwiftLint, so this installs the
      # latest release, or keeps the runner's copy if it is already up to date.
      - name: Install SwiftLint
        if: ${{ !cancelled() }}
        run: |
          brew install swiftlint
          swiftlint version

      # Runs even when the formatting check fails, so one run reports both.
      - name: Lint (SwiftLint)
        if: ${{ !cancelled() }}
        run: swiftlint lint --strict

  duplication:
    name: Find duplicated code
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2

      - name: Find duplicated code (jscpd)
        run: bunx jscpd@5.4.3
