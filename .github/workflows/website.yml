name: Website

# Checks the nightbar.app landing page in website/. Vercel deploys it on its own.
# A release pull request from development into main skips its own run: the
# push run on development already checked the same commit.
on:
  pull_request:
    paths:
      - "website/**"
      - "install.sh"
      - ".github/workflows/website.yml"
  push:
    branches: [development]
    paths:
      - "website/**"
      - "install.sh"
      - ".github/workflows/website.yml"

permissions:
  contents: read

# Grouped by pull request number, as in swift.yml: a run for an already merged
# pull request gets the base branch as its ref and would cancel the push run.
concurrency:
  group: website-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: website

jobs:
  check:
    name: Check, test and build
    if: github.head_ref != 'development'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          working-directory: website
          node-version: "24"
          cache: true
          run-install: |
            args: ["--frozen-lockfile"]

      - run: vp check
      - run: vp run fallow
      - run: vp test
      - run: vp run build
