<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Nightbar: a black menu bar for macOS</title>
        <meta
            name="description"
            content="Nightbar makes the macOS menu bar black with white icons, on any wallpaper and every screen. Free and open source."
        />
        <meta name="color-scheme" content="dark" />
        <meta name="theme-color" content="#050506" />
        <link rel="canonical" href="https://nightbar.app/" />
        <meta property="og:type" content="website" />
        <meta property="og:url" content="https://nightbar.app/" />
        <meta property="og:title" content="Nightbar: a black menu bar for macOS" />
        <meta
            property="og:description"
            content="Makes the macOS menu bar black with white icons, on any wallpaper and every screen."
        />
        <meta property="og:image" content="https://nightbar.app/icon-512.png" />
        <meta name="twitter:card" content="summary" />
        <link rel="icon" href="/favicon.ico" sizes="48x48" />
        <link rel="icon" type="image/svg+xml" href="/icon.svg" />
        <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
        <link rel="manifest" href="/site.webmanifest" />
        <!-- The page stays hidden until these load, so fetch them before the stylesheet asks. -->
        <link
            rel="preload"
            href="/node_modules/@fontsource-variable/geist/files/geist-latin-wght-normal.woff2"
            as="font"
            type="font/woff2"
            crossorigin
        />
        <link
            rel="preload"
            href="/node_modules/@fontsource-variable/space-grotesk/files/space-grotesk-latin-wght-normal.woff2"
            as="font"
            type="font/woff2"
            crossorigin
        />
        <link
            rel="preload"
            href="/node_modules/@fontsource-variable/geist-mono/files/geist-mono-latin-wght-normal.woff2"
            as="font"
            type="font/woff2"
            crossorigin
        />
        <link rel="stylesheet" href="/src/styles/index.css" />
        <script>
            // Hide the page until its fonts are ready, so no text swaps font after it shows.
            // src/fonts.ts reveals it; the timeout makes sure a failed load never keeps it hidden.
            document.documentElement.classList.add('is-loading')
            setTimeout(() => document.documentElement.classList.remove('is-loading'), 3000)
        </script>
        <script type="module" src="/src/main.ts"></script>
    </head>
    <body>
        <!--page-->
    </body>
</html>
