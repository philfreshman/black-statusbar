<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Nightbar: a black menu bar for macOS</title>
        <meta
            name="description"
            content="Nightbar makes the macOS menu bar black with white icons, on any wallpaper and every screen. The notch disappears. Free and open source."
        />
        <meta name="robots" content="index, follow, max-image-preview:large" />
        <meta name="application-name" content="Nightbar" />
        <meta name="apple-mobile-web-app-title" content="Nightbar" />
        <meta name="color-scheme" content="dark" />
        <meta name="theme-color" content="#050506" />
        <link rel="canonical" href="https://nightbar.app/" />
        <!-- Share previews: Open Graph for most apps, the twitter: tags for X. -->
        <meta property="og:type" content="website" />
        <meta property="og:site_name" content="Nightbar" />
        <meta property="og:locale" content="en_US" />
        <meta property="og:url" content="https://nightbar.app/" />
        <meta property="og:title" content="Nightbar: a black menu bar for macOS" />
        <meta
            property="og:description"
            content="Makes the macOS menu bar black with white icons, on any wallpaper and every screen. Free and open source."
        />
        <meta property="og:image" content="https://nightbar.app/og-image.png" />
        <meta property="og:image:type" content="image/png" />
        <meta property="og:image:width" content="1200" />
        <meta property="og:image:height" content="630" />
        <meta
            property="og:image:alt"
            content="The Nightbar N above the headline: a black menu bar for macOS."
        />
        <meta name="twitter:card" content="summary_large_image" />
        <meta name="twitter:title" content="Nightbar: a black menu bar for macOS" />
        <meta
            name="twitter:description"
            content="Makes the macOS menu bar black with white icons, on any wallpaper and every screen. Free and open source."
        />
        <meta name="twitter:image" content="https://nightbar.app/og-image.png" />
        <meta
            name="twitter:image:alt"
            content="The Nightbar N above the headline: a black menu bar for macOS."
        />
        <!-- Tells search engines this page is about a free macOS app. -->
        <script type="application/ld+json">
            {
                "@context": "https://schema.org",
                "@type": "SoftwareApplication",
                "name": "Nightbar",
                "description": "Nightbar makes the macOS menu bar black with white icons, on any wallpaper and every screen.",
                "url": "https://nightbar.app/",
                "image": "https://nightbar.app/icon-512.png",
                "screenshot": "https://nightbar.app/og-image.png",
                "applicationCategory": "UtilitiesApplication",
                "operatingSystem": "macOS 14 or later",
                "downloadUrl": "https://nightbar.app/download",
                "isAccessibleForFree": true,
                "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
                "sameAs": ["https://github.com/philfreshman/nightbar"]
            }
        </script>
        <link rel="icon" href="/favicon.ico" sizes="48x48" />
        <link rel="icon" type="image/svg+xml" href="/icon.svg" />
        <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
        <link rel="manifest" href="/site.webmanifest" />
        <!-- Fetch the fonts before the stylesheet asks, so they are ready for the first paint. -->
        <link
            rel="preload"
            href="/node_modules/@fontsource-variable/geist/files/geist-latin-wght-normal.woff2"
            as="font"
            type="font/woff2"
            crossorigin
        />
        <link
            rel="preload"
            href="/node_modules/@fontsource-variable/space-grotesk/files/space-grotesk-latin-wght-normal.woff2"
            as="font"
            type="font/woff2"
            crossorigin
        />
        <link
            rel="preload"
            href="/node_modules/@fontsource-variable/geist-mono/files/geist-mono-latin-wght-normal.woff2"
            as="font"
            type="font/woff2"
            crossorigin
        />
        <link rel="stylesheet" href="/src/styles/index.css" />
        <script type="module" src="/src/main.ts"></script>
    </head>

        <!--page-->
    </body>
</html>
