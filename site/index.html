<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Nightbar</title>
  <meta name="description" content="A small macOS app that keeps the menu bar black with white icons on every wallpaper.">
  <meta name="theme-color" content="#000000">
  <meta name="color-scheme" content="dark">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icon.svg">
  <meta property="og:title" content="Nightbar">
  <meta property="og:description" content="Black menu bar. Any wallpaper.">
  <meta property="og:url" content="https://nightbar.app">
  <meta property="og:type" content="website">
  <style>
    :root {
      --text: #f4e6dc;
      --muted: rgba(244, 230, 220, 0.72);
      --peach: #e9a886;
      --bar: 34px;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", "Segoe UI", Roboto, sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      min-height: 100dvh;
      overflow: hidden;
      color: var(--text);
      -webkit-font-smoothing: antialiased;
      /* The page is the wallpaper. */
      background:
        radial-gradient(55% 45% at 85% 0%, rgba(240, 174, 134, 0.35), transparent 70%),
        linear-gradient(180deg, #4e2a48 0%, #5f3a4c 45%, #6c4a48 100%);
    }

    /* The page's own menu bar, which the toggle switches. */
    .menubar {
      position: fixed; inset: 0 0 auto; height: var(--bar); z-index: 2;
      display: flex; align-items: center; justify-content: flex-end; gap: 18px;
      padding: 0 20px; font-size: 14px; font-weight: 600;
      background: rgba(255, 255, 255, 0.5);
      -webkit-backdrop-filter: blur(20px) saturate(1.6); backdrop-filter: blur(20px) saturate(1.6);
      color: #1a1a1a;
      transition: background .45s ease, color .45s ease;
    }
    body.on .menubar { background: #000; color: #fff; }
    .menubar svg { height: 16px; width: auto; display: block; }

    main {
      min-height: 100dvh;
      display: flex; flex-direction: column; justify-content: center;
      padding: calc(var(--bar) + 32px) clamp(20px, 6vw, 72px) 72px;
      max-width: 760px;
    }
    .brand { display: flex; align-items: center; gap: 12px; font-size: 20px; font-weight: 700; }
    .brand img { width: 34px; height: 34px; }
    h1 {
      margin: 28px 0 16px;
      font-size: clamp(34px, 5.4vw, 56px); line-height: 1.05; letter-spacing: -0.03em; font-weight: 800;
    }
    p { margin: 0; max-width: 470px; font-size: clamp(16px, 1.6vw, 19px); line-height: 1.55; color: var(--muted); }

    .actions { margin-top: 36px; display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
    .btn {
      display: inline-flex; align-items: center; height: 54px; padding: 0 28px; border-radius: 999px;
      background: var(--peach); color: #1d0f14; text-decoration: none; font-size: 18px; font-weight: 700;
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.25);
      transition: transform .15s ease, filter .15s ease;
    }
    .btn:hover { transform: translateY(-1px); filter: brightness(1.05); }

    .switch {
      width: 70px; height: 38px; padding: 0; border: 0; border-radius: 999px; cursor: pointer;
      background: rgba(255, 255, 255, 0.25); position: relative;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.15);
      transition: background .3s ease;
    }
    .switch::after {
      content: ""; position: absolute; top: 4px; left: 4px; width: 30px; height: 30px; border-radius: 50%;
      background: #fff; box-shadow: 0 2px 6px rgba(0,0,0,.3); transition: transform .3s ease;
    }
    .switch[aria-checked="true"] { background: #0c0a10; }
    .switch[aria-checked="true"]::after { transform: translateX(32px); }
    .hint { font-size: 14px; color: var(--muted); }

    footer {
      position: fixed; left: clamp(20px, 6vw, 72px); right: clamp(20px, 6vw, 72px); bottom: 20px;
      display: flex; gap: 18px; font-size: 13px; color: var(--muted);
    }
    footer a { color: inherit; text-underline-offset: 3px; }
    footer a:hover { color: var(--text); }

    :focus-visible { outline: 2px solid #fff; outline-offset: 3px; }
    @media (max-height: 520px) { body { overflow: auto; } }
    @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  </style>
</head>
<body class="on">
  <div class="menubar" aria-hidden="true">
    <svg viewBox="0 0 20 16"><rect x="1.85" y="1.85" width="16.3" height="12.3" rx="2.55" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M1 4.4C1 2.5 2.5 1 4.4 1h11.2C17.5 1 19 2.5 19 4.4v1.2H1z" fill="currentColor"/></svg>
    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M1.8 6.2a8.8 8.8 0 0 1 12.4 0M4.2 8.7a5.4 5.4 0 0 1 7.6 0M6.6 11.1a2 2 0 0 1 2.8 0"/></svg>
    <span>9:41</span>
  </div>

  <main>
    <div class="brand"><img src="/icon.svg" alt="">Nightbar</div>
    <h1>Black menu bar.<br>Any wallpaper.</h1>
    <p>A small macOS app that puts a black strip behind the menu bar, so it stays black with white icons on every wallpaper.</p>
    <div class="actions">
      <a class="btn" id="download" href="https://github.com/philfreshman/nightbar/releases/latest/download/Nightbar.zip">Download</a>
      <button class="switch" id="toggle" role="switch" aria-checked="true" aria-label="Preview Nightbar on this page's menu bar"></button>
      <span class="hint" id="hint">Try it on the menu bar above</span>
    </div>
  </main>

  <footer>
    <span id="meta">macOS 14 or later</span>
    <a href="https://github.com/philfreshman/nightbar">GitHub</a>
  </footer>

  <script>
    (function () {
      var repo = "philfreshman/nightbar";
      var toggle = document.getElementById("toggle");
      toggle.addEventListener("click", function () {
        var on = toggle.getAttribute("aria-checked") !== "true";
        toggle.setAttribute("aria-checked", String(on));
        document.body.classList.toggle("on", on);
      });

      // Link the button to the latest release's zip, or to the releases page
      // while there is no release yet.
      fetch("https://api.github.com/repos/" + repo + "/releases/latest")
        .then(function (res) {
          if (res.status === 404) return null;
          if (!res.ok) throw new Error("GitHub API " + res.status);
          return res.json();
        })
        .then(function (release) {
          var btn = document.getElementById("download");
          if (!release) {
            btn.href = "https://github.com/" + repo + "/releases";
            return;
          }
          var asset = (release.assets || []).find(function (a) { return /\.zip$/i.test(a.name); });
          if (asset) btn.href = asset.browser_download_url;
          document.getElementById("meta").textContent =
            "Version " + release.tag_name.replace(/^v/, "") + " · macOS 14 or later";
        })
        .catch(function () {});
    })();
  </script>
</body>
</html>
